name: Release using GoReleaser

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ secrets.GPG_FINGERPRINT }}

  # The old step rsynced dist/ into ~/pages/dl/raw, a tree no nginx site
  # serves any more. Releases now go through the PiLAB repository builder.
  publish:
    needs: [goreleaser]
    if: startsWith(github.ref, 'refs/tags/v')
    uses: pilab-dev/release-toolchain/.github/workflows/sync-dl.yml@v1
    with:
      source: release
      tier: testing
      # The rpm Requires openvswitch, which EL9 does not ship; the deb side
      # covers the install test.
      install-rpm: false
    secrets: inherit
